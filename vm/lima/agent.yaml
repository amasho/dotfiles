# Lima: エージェント (Claude Code / Codex) 用の隔離 VM
#
#   limactl create --name=agent vm/lima/agent.yaml && limactl start agent
#
# Mac とのつながりは最小限にする:
#   - 共有は ~/vm-inbox のみ (VM からは読み取り専用)。ubuntu-26.04 テンプレートは
#     _default/mounts で ~ を共有するため、base には _images だけを指定する
#   - Mac の ~/.ssh の公開鍵・ssh-agent は VM に渡さない
#   - コンテナ実行環境 (containerd / nerdctl) は入れない
minimumLimaVersion: 2.0.0
base:
  - template:_images/ubuntu-26.04

cpus: 6
memory: "16GiB"
disk: "100GiB"

mounts:
  - location: "~/vm-inbox"
    writable: false

ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false

containerd:
  system: false
  user: false

# Mac (127.0.0.1) に転送するポートは決めたものだけにする。VM の中のブラウザ
# (terminal-browser) の CDP などを Mac のプロセスから触れないようにするため
portForwards:
  - guestPort: 3000 # frontend の dev server
  - guestPort: 8000 # backend の dev server
  - guestPort: 1455 # codex login の受け口 (ログインのときだけ使う)
  - guestPortRange: [1, 65535]
    proto: any # TCP だけでなく UDP も転送しない (0.0.0.0 で待ち受ける UDP には効かないので、mDNS は下の provision で止める)
    ignore: true

provision:
  # systemd-resolved の mDNS / LLMNR を止める。VM では .local の名前解決は使わないのに、
  # mDNS が 0.0.0.0:5353 で待ち受けると Lima が Mac の 127.0.0.1:5353 に転送してしまうため。
  # Lima の 00-lima-enable-mdns.conf より後に読まれる名前にして上書きする
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      conf=/etc/systemd/resolved.conf.d/no-mdns.conf
      new=$(printf '[Resolve]\nMulticastDNS=no\nLLMNR=no\n')
      if [ "$(cat "$conf" 2>/dev/null)" != "$new" ]; then
        mkdir -p "$(dirname "$conf")"
        printf '%s\n' "$new" > "$conf"
        systemctl restart systemd-resolved
      fi
